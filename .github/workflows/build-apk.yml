name: Build FeedXL APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Android project from source archive
        shell: bash
        run: |
          set -euo pipefail
          base64 -d feedxl-source.zip.b64 > /tmp/feedxl-source.zip
          # The uploaded base64 archive has one damaged compressed entry.
          # Extract the other files, then restore app/build.gradle explicitly.
          unzip -o /tmp/feedxl-source.zip -d . || true
          mkdir -p app
          cat > app/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.5.2'
          }

          android {
              namespace 'com.feedxl.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.feedxl.app'
                  minSdk 26
                  targetSdk 34
                  versionCode 205
                  versionName '205'
              }

              buildTypes {
                  debug {
                      applicationIdSuffix ''
                  }
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          GRADLE
          test -s settings.gradle
          test -s build.gradle
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/java/com/feedxl/app/MainActivity.java
          echo "Project files verified; restored app/build.gradle."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FeedXL-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
