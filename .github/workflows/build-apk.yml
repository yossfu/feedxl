name: Build FeedXL APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Android project from source archive
        shell: bash
        run: |
          set +e
          base64 -d feedxl-source.zip.b64 > /tmp/feedxl-source.zip
          unzip -o /tmp/feedxl-source.zip -d .
          unzip_rc=$?
          echo "unzip exit code: $unzip_rc (known damaged archive entry is being bypassed)"
          mkdir -p app
          cat > app/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.5.2'
          }

          android {
              namespace 'com.feedxl.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.feedxl.app'
                  minSdk 26
                  targetSdk 34
                  versionCode 205
                  versionName '205'
              }

              buildTypes {
                  debug {
                      applicationIdSuffix ''
                  }
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          GRADLE
          # Restore the manifest too: this entry was zero bytes in the damaged archive.
          cat > app/src/main/AndroidManifest.xml <<'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@style/Theme.FeedXL"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="false"
                  android:allowBackup="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenSize|screenLayout|smallestScreenSize|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST
          echo "---- extracted file inventory ----"
          find . -maxdepth 8 -type f -not -path './.git/*' -printf '%s bytes %p\n' | sort
          echo "---- required source checks ----"
          test -s settings.gradle || exit 21
          test -s build.gradle || exit 22
          test -s app/src/main/AndroidManifest.xml || exit 23
          test -s app/src/main/java/com/feedxl/app/MainActivity.java || exit 24
          test -s app/build.gradle || exit 25
          echo "Project files verified; restored app/build.gradle."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FeedXL-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
