name: Build FeedXL APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore Android project from source archive
        run: |
          base64 -d feedxl-source.zip.b64 > /tmp/feedxl-source.zip
          unzip -o /tmp/feedxl-source.zip -d .
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FeedXL-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
