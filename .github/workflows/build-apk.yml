name: Build FeedXL APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Android project from source archive
        shell: bash
        run: |
          set -eu
          base64 -d feedxl-source.zip.b64 > /tmp/feedxl-source.zip
          # The uploaded archive contains a damaged entry, but the other files are recoverable.
          unzip -o /tmp/feedxl-source.zip -d . || true
          mkdir -p app/src/main
          cat > app/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.5.2'
          }

          android {
              namespace 'com.feedxl.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.feedxl.app'
                  minSdk 26
                  targetSdk 34
                  versionCode 205
                  versionName '205'
              }

              buildTypes {
                  debug { applicationIdSuffix '' }
                  release { minifyEnabled false }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          GRADLE

          # Enable AndroidX for WebViewCompat's JavaScript message listener.
          if [ -f gradle.properties ]; then
            sed -i 's/android.useAndroidX=false/android.useAndroidX=true/' gradle.properties
            grep -q 'android.useAndroidX=true' gradle.properties || echo 'android.useAndroidX=true' >> gradle.properties
          else
            echo 'android.useAndroidX=true' > gradle.properties
          fi

          # Restore the manifest because the same archive entry was corrupted.
          cat > app/src/main/AndroidManifest.xml <<'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@style/Theme.FeedXL"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="false"
                  android:allowBackup="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenSize|screenLayout|smallestScreenSize|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST

          # Patch the fxNative bridge to use supported AndroidX WebKit APIs.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/feedxl/app/MainActivity.java")
          lines = p.read_text(encoding="utf-8").splitlines()
          import_line = "import android.widget.TextView;"
          if import_line not in lines:
              raise SystemExit("Could not find Android imports for WebKit fix")
          idx = lines.index(import_line) + 1
          lines[idx:idx] = [
              "",
              "import androidx.webkit.JavaScriptReplyProxy;",
              "import androidx.webkit.WebMessageCompat;",
              "import androidx.webkit.WebViewCompat;",
          ]
          source = chr(10).join(lines)
          replacements = [
              ("web.addWebMessageListener(", "WebViewCompat.addWebMessageListener(web, "),
              ("new WebView.WebMessageListener()", "new WebViewCompat.WebMessageListener()"),
              ("WebView.WebMessage message", "WebMessageCompat message"),
              ("WebView.WebMessagePort replyProxy", "JavaScriptReplyProxy replyProxy"),
          ]
          for old, new in replacements:
              if old not in source:
                  raise SystemExit("Missing pattern while applying WebKit fix: " + old)
              source = source.replace(old, new, 1)
          p.write_text(source + chr(10), encoding="utf-8")
          PY

          test -s settings.gradle
          test -s build.gradle
          test -s gradle.properties
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/java/com/feedxl/app/MainActivity.java
          grep -q 'WebViewCompat.addWebMessageListener' app/src/main/java/com/feedxl/app/MainActivity.java
          grep -q 'android.useAndroidX=true' gradle.properties
          echo "Project and WebKit bridge checks passed."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FeedXL-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
